# Configuration of the agent container, read by agenticwf.agent.core.common.config
# (AGENTICWF_CONFIG=/etc/agenticwf/agent.cfg). Mount your own file there to override it.
# Auth settings are environment variables, see docs/deployment.md.

[database]
# The container's own PostgreSQL over its Unix socket; peer authentication maps the OS
# user `agent` to the role `agent`, so there is no password. To use an external server:
#   default = postgresql+psycopg2://agent:<password>@db.example.org:5432/agent
# (write a literal % in the password as %%).
default = postgresql+psycopg2://agent@/agent?host=/run/postgresql
pool_size=10
max_overflow=10
pool_recycle=3600
echo=0
pool_reset_on_return=rollback

[logging]
# level: DEBUG/INFO/WARNING/ERROR
level=INFO
# file: optional rotating log file; console logging always happens
# file=/var/lib/agenticwf-agent/logs/agent.log    (a directory the agent can write)

[context]
# System task types (task-types/<type>/AGENTS.md, WORKFLOW.md, task.yaml) and tools (tools/*.md);
# the image ships the default task type. Mount your own directory here to add types and tools.
system_dir = /etc/agenticwf/agent
# Per-user task types and plugins (the admin page's "Mine"), on the data volume.
sandbox_root = /var/lib/agenticwf-agent/sandboxes

[tools]
# System plugins (task types, tools, MCP servers), one directory per plugin; see docs/plugins.md.
# plugin_dirs = /etc/agenticwf/plugins
# top_k = 15             # tools offered at the start, closest to the request first
# top_k_skills = 5       # skills offered besides them (docs/skills.md)

[plugins]
# disabled = github                       # system plugins to switch off without removing them

[mcp]
# MCP endpoints: from plugins, and those users add on the admin page (docs/mcp.md).
# allowed_hosts = mcp.example.org, *.tools.example.org   # hosts users' endpoints may reach (none by default)
# connect_timeout = 15
# discovery_ttl = 300                     # seconds a user plugin's MCP tool list is reused

[harness]
# max_steps = 50
# split = false          # split messages into several typed tasks (one extra model call)
# plan = never           # always: plan each task into turns first
# workers = 4                   # job loops in this process
# max_jobs_per_owner =          # one person's jobs at once; default: workers - 1 (one is left for others)
# shared = false                # true: worker processes (agenticwf-agent-worker) share the jobs through the
#                               # database; the container sets it from AGENT_WORKER_PROCESSES (docs/deployment.md)
# conversation_messages = 20    # a chat's earlier messages are summarised past this many,
# conversation_tokens = 8000    # or past this many tokens; the newest few stay as they are
# conversation_keep = 4

[memory]
# Long-term memory, per person (docs/agent-structure.md, Long-term memory).
# consolidate_failed = false    # also keep what failed and cancelled tasks noted (it may be wrong)
# extract = llm                 # llm: a model call picks what lasts; notes: keep working-memory notes as they are
# model =                       # the model for that call; empty: the task's
# max_per_task = 5
# On by default: the API keeps memories in the database (or on the KB with [knowledge] memory = true),
# recalls them at task start and offers memory_search; [embeddings] adds matching by meaning.
consolidate_failed = false
extract = llm                   # the consolidate call is routed ([llm.routing] consolidate) unless model is set
max_per_task = 5

[llm.routing]
# Choose models by what each call needs and costs (docs/model-routing.md). Models take part when
# they declare a tier and a context_window ([llm.model.<id>] tier = small|medium|large, ...).
# mode = auto                     # auto | pinned (always the named model, else the default)
# step = medium                   # the least tier per purpose: step, plan, split, reply, compact,
# split = small                   # compact_conversation, consolidate, final_report, cron_check, cron_report
# context_headroom = 0.25
# max_escalations = 1
# task_budget =                   # a task's cost limit (cost units)
# feedback = suggest              # suggest | adjust
mode = auto
step = medium                     # agent steps with tools: qwen3.8 / gpt-oss, glm when escalated or the context is large
plan = medium
split = small                     # helper calls: the cheapest model that fits (gemma, qwen3-32b)
reply = small
compact = small
compact_conversation = small
consolidate = small
cron_check = small
cron_report = small
context_headroom = 0.25
max_escalations = 1               # a failed step is retried once on the next tier up (glm)
feedback = suggest

[llm.purpose]
# Pin a purpose to a model id: compact_conversation = gemma

[llm.budgets]
# default = 20 per day            # per owner, in [llm] cost_unit; organization.<org> = 2000 per month
# max_tier = large                # max_tier.<subject> = medium

[cron]
# Scheduled checks, the issue board and shift reports (docs/cron.md). Crons are defined in
# <system dir>/crons/, plugins' crons/, users' sandboxes and on the Crons page.
# enabled = true                # run the scheduler in this process
# tick = 30                     # seconds between scheduler passes
# system_scopes =               # caps the scopes system and plugin crons may request; empty: no cap
# max_scopes =                  # caps a user's cron's scopes (otherwise the owner's, when they enabled it)
# deny_tools = ggus__create* jira__create*   # never offered to a cron's tasks (crons do not file tickets)

# [knowledge]
# The knowledge service (AgenticWF-KB): kb_search, kb_read, kb_grep and kb_research, and the KB
# catalogue in context
# (docs/agent-structure.md, Knowledge base). Empty url: no knowledge service.
# url = unix:/run/agenticwf-kb/kb.sock   # the KB's service listener (mount its socket volume), or
#                                        # http://agenticwf-kb:8021 on a Docker network only the two join
# base_path = /kb
# mode = service                         # service: forward the task's user; bearer: a personal KB's token
# token_file =                           # bearer mode
# timeout = 20
# research_timeout = 200                 # kb_research (the KB's agentic search)
# tools = auto                           # search tools offered: auto (kb_search and kb_research, the model
#                                        # decides), kb_search or kb_research; users may choose their own
# research_preset = model                # kb_research's preset: model (the model picks), kb (the KB's default:
#                                        # smart, or deep without web), auto, quick, deep, wiki, smart;
#                                        # users may choose their own
# max_catalog = 20
# memory = false                         # true: long-term memory on the KB's temporal memory
# memory_group = agent
# allowed_hosts =                        # hosts of the knowledge services users connect on the admin page
#                                        # (none by default), e.g. kb.example.org, *.kb.example.org

[web_search]
# Web search and fetch as core tools (AgenticWF-KB docs/agent-integration.md, Research: KB and
# web). web_search is offered in every task: the model decides when a request needs the web, and
# which of the providers below to ask. Empty providers: no web tools.
providers = duckduckgo, tavily       # in order of preference; `auto` tries each in turn until one returns results
#                                    # duckduckgo (no key) | searxng (url) | tavily | brave | bing | google (cx)
#                                    # | exa | bocha | kb (through AgenticWF-KB: its providers, PDF/Office pages,
#                                    # one page version per task)
# max_results = 5
# timeout = 15
# always_offer = true                # false: web_search only when it matches the request (or search_tools)
# fetch = true                       # offer web_fetch
# fetch_max_chars = 20000
# fetch_allowed_hosts = *            # public hosts; internal ones only when listed by name
#
# Per provider (all optional except searxng url and google cx). Keys come from the environment
# (agent.env); a provider whose key is not set is left out with a warning.
# [web_search.searxng]
# url = http://searxng:8080
# [web_search.tavily]
# api_key_env = TAVILY_API_KEY       # the default; likewise BRAVE_API_KEY, BING_API_KEY, EXA_API_KEY, BOCHA_API_KEY
# [web_search.google]
# api_key_env = GOOGLE_API_KEY
# cx = <Programmable Search Engine id>

[embeddings]
# Match tools, skills and memories by meaning as well as by words ("changelog" finds release-notes).
# Empty provider: words only (BM25). See docs/agent-runtime.md, Selecting tools for a task.
# provider = voyage             # voyage | openai | ollama | vllm (any OpenAI-compatible /embeddings)
# model = voyage-3.5
# base_url =                    # the provider's default; required for vllm
# api_key_env = VOYAGE_API_KEY  # the provider's default
# weight = 0.6                  # share of meaning in the score; words the rest
# min_similarity = 0.3          # how close a candidate sharing no word must be
provider = vllm                 # CERN AI gateway, OpenAI-compatible: posts to <base_url>/embeddings
model = e5-large-v2             # 1024 dimensions; or embeddinggemma-300m (768)
base_url = https://aigw.cern.ch
api_key_env = CERN_AIGW_API_KEY
weight = 0.6
min_similarity = 0.3

[llm]
# Models come from here ([llm.model.<id>]) and from the database (managers add them while the
# agent runs: POST /api/v1/admin/models). `default` names the model used when nothing chooses
# one. See docs/agent-models.md.
# default = echo
# fallback = sonnet          # ids tried in order when the default's provider fails
# Hosts that models people add on the admin page may point at (their base_url), besides the
# providers' own APIs (none by default). Those models use their own key, never this environment.
# allowed_hosts = vllm.example.org, *.models.example.org
default = cern-qwen38
fallback = cern-gpt-oss-20b
allowed_hosts = aigw.cern.ch          # hosts that models added on the admin page may point at
cost_unit = units                     # relative GPU cost of the self-hosted models below

# `echo` answers with the request: the service runs end to end without a model provider.
[llm.model.echo]
provider = echo
model = echo
label = Echo (testing)

# [llm.model.opus]
# provider = anthropic
# model = claude-opus-5-5
# label = Claude Opus 5.5
# effort = high
# fallbacks = default        # re-run declined requests on Anthropic's recommended fallback
#
# [llm.model.gpt]
# provider = openai
# model = <an OpenAI model name>
#
# [llm.model.qwen]
# provider = vllm
# model = Qwen/Qwen3-32B
# base_url = http://gpu01.example.org:8000/v1
#
# [llm.model.local]
# provider = ollama
# model = qwen3:32b
# base_url = http://127.0.0.1:11434/v1
#
# Credentials and defaults per provider; keys come from the environment (agent.env), never here.
# [llm.provider.anthropic]
# api_key_env = ANTHROPIC_API_KEY
# [llm.provider.openai]
# api_key_env = OPENAI_API_KEY

# CERN AI gateway (aigw.cern.ch), OpenAI-compatible. tier, context_window and capabilities let the
# router choose among them (docs/model-routing.md); costs are relative (gemma 1 ... glm 10).
[llm.model.cern-qwen38]
provider = vllm
model = qwen3.8-27b-fp16
label = Qwen 3.8 27B (CERN)
base_url = https://aigw.cern.ch
api_key_env = CERN_AIGW_API_KEY
tier = medium
context_window = 131072
capabilities = tools, vision
cost_input = 3
cost_output = 3

[llm.model.cern-qwen3-32b]
provider = vllm
model = hf-qwen3-32b-awq
label = Qwen3 32B AWQ (CERN)
base_url = https://aigw.cern.ch
api_key_env = CERN_AIGW_API_KEY
tier = small                       # short context: helper calls on small inputs
context_window = 16384
capabilities = tools
cost_input = 2
cost_output = 2

[llm.model.cern-gpt-oss-20b]
provider = vllm
model = gpt-oss-20b
label = GPT OSS 20B (CERN)
base_url = https://aigw.cern.ch
api_key_env = CERN_AIGW_API_KEY
tier = medium
context_window = 32768
capabilities = tools, reasoning
cost_input = 2
cost_output = 2

[llm.model.cern-glm-5.3-flash-int4]
provider = vllm
model = glm-5.3-flash-int4
label = GLM 5.3 Flash int4 (CERN)
base_url = https://aigw.cern.ch
api_key_env = CERN_AIGW_API_KEY
tier = large                       # hard tasks, escalations and very large contexts
context_window = 1048570
max_output = 131072
capabilities = tools, vision, reasoning
cost_input = 10
cost_output = 10
speed = slow

[llm.model.cern-gemma4-12b]
provider = vllm
model = gemma-4-12b-it-qat-w4a16-ct
label = Gemma 4 12B (CERN)
base_url = https://aigw.cern.ch
api_key_env = CERN_AIGW_API_KEY
tier = small                       # no tool calling: summaries, splitting, memory consolidation
context_window = 131072
capabilities = vision
cost_input = 1
cost_output = 1
speed = fast
