; AgenticWF agent API on :8000 (Caddy's application upstream).
[program:agent]
command=/usr/local/bin/log-prefix.sh agent /usr/local/bin/start-agent.sh
user=agent
directory=/home/agent
environment=HOME="/home/agent"
priority=30
autorestart=true
startsecs=5
; start-agent.sh itself waits for the database; beyond that, a program that keeps failing
; becomes FATAL and fatal.ini stops the container for Docker to restart.
startretries=10
; uvicorn finishes requests for at most 5 s (--timeout-graceful-shutdown), then the agent shuts
; its workers down; PostgreSQL stops after the agent.
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
