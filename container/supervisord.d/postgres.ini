; PostgreSQL: database `agent`, Unix socket /run/postgresql only (no TCP listener).
[program:postgres]
command=/usr/local/bin/log-prefix.sh postgres /usr/bin/postgres -D %(ENV_PGDATA)s
user=postgres
priority=10
autorestart=true
startsecs=5
; SIGINT = PostgreSQL "fast" shutdown
stopsignal=INT
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
