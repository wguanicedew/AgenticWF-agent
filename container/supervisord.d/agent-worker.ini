; Worker processes beside the API process (docs/deployment.md, Worker processes). Off unless
; AGENT_WORKER_PROCESSES > 0: then agent.cfg must say [harness] shared = true (the entrypoint
; does when it is set). Each process runs [harness] workers job loops.
[program:agent-worker]
command=/usr/local/bin/log-prefix.sh agent-worker-%(process_num)s /usr/local/bin/start-agent-worker.sh
process_name=%(program_name)s-%(process_num)s
numprocs=%(ENV_AGENT_WORKER_PROCESSES_SLOTS)s
autostart=%(ENV_AGENT_WORKERS_AUTOSTART)s
user=agent
directory=/home/agent
environment=HOME="/home/agent"
priority=40
autorestart=true
startsecs=5
startretries=10
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
