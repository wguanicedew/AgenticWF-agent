[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agenticwf-agent-client"
version = "0.1.0"
description = "AgenticWF agent client: the Python AgentClient and the `agenticwf agent` command"
license = "Apache-2.0"
authors = [{name = "Wen Guan", email = "wen.guan@cern.ch"}]
readme = "README.md"
requires-python = ">=3.9"
# The `agenticwf agent` command and AgentClient.from_env also need `agenticwf-auth-client` (the
# `agenticwf` command and its sign-in). The PyPI releases declare it: the AgenticWF repository's
# scripts/build-clients.sh adds it, pinned to the same version. Not declared here, so that a
# checkout installs without it on PyPI; install it from the AgenticWF-auth repository:
#   pip install ../AgenticWF-auth/cli
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.entry-points."agenticwf.commands"]
agent = "agenticwf.agent.client.cli:register"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agenticwf.agent.client*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
